  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/matrix-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="grid-floor" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="callsign">
      <img src="/matrix-icon.svg" alt="" width="22" height="22" />
      <div>
        <b id="ship-name">BLACKOUT</b>
        <small id="ship-sub">BRIDGE // CMD</small>
      </div>
    </div>
    <div class="hud-lights">
      <span class="light" id="net" aria-live="polite">NET</span>
      <span class="light" id="pwr">PWR</span>
      <span class="hud-clock" id="hud-clock">--:--</span>
    </div>
  </header>

  <main class="bridge" id="bridge">
    <section class="viewscreen panel" id="viewscreen" aria-label="Main viewscreen"></section>
    <p class="ticker" id="ticker" aria-live="off"></p>
    <div class="deck-head">
      <h2>STATIONS</h2>
      <span id="station-count"></span>
    </div>
    <div class="modules" id="modules"></div>
  </main>

  <nav class="dock" aria-label="Bridge controls">
    <button type="button" id="dock-edit" class="dock-btn" aria-pressed="false"><span>⇅</span>ARRANGE</button>
    <button type="button" id="dock-fab" class="dock-btn primary"><span>+</span>FABRICATE</button>
    <button type="button" id="dock-share" class="dock-btn"><span>⇪</span>SHARE</button>
    <a href="/build" class="dock-btn"><span>✦</span>STUDIO</a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet panel" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header class="sheet-head">
      <span class="sheet-icon" id="sheet-icon"></span>
      <h2 id="sheet-title"></h2>
      <div class="sheet-actions" id="sheet-actions"></div>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="color:#ff7a1a;font-family:monospace;padding:16px">The bridge needs JavaScript turned on.</p></noscript>
  <script src="/themes.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
